name: Build and deploy Shape Note site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [atlas-updated, local-ai-updated, hollow-square-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site hub
        uses: actions/checkout@v4

      - name: Check out the independent Atlas source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/shapenote-atlas
          ref: main
          path: atlas-source

      - name: Check out the independent Local AI source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/sacred-harp-finetune
          ref: main
          path: local-ai-source

      - name: Check out the independent Hollow Square source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/hollow-square
          ref: main
          path: hollow-square-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-source/package-lock.json

      - name: Assemble the publication
        run: |
          python3 scripts/assemble.py \
            --atlas atlas-source \
            --local-ai local-ai-source \
            --hollow-square hollow-square-source \
            --output site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Retain exact source revisions
        uses: actions/upload-artifact@v4
        with:
          name: source-revisions
          path: site/build-manifest.json
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
