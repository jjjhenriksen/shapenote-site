name: Build and deploy Shape Note site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [atlas-updated, local-ai-updated, hollow-square-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site hub
        uses: actions/checkout@v4

      - name: Check out the independent Atlas source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/shapenote-atlas
          ref: main
          path: atlas-source
          token: ${{ secrets.ATLAS_READ_TOKEN }}

      - name: Check out the independent Local AI source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/sacred-harp-finetune
          ref: main
          path: local-ai-source

      - name: Check out the independent Hollow Square source
        uses: actions/checkout@v4
        with:
          repository: jjjhenriksen/hollow-square
          ref: main
          path: hollow-square-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-source/package-lock.json

      - name: Build the Atlas for its publication path
        working-directory: atlas-source
        run: |
          npm ci
          npm run build -- --base=/atlas/

      - name: Assemble the publication
        run: |
          mkdir -p site/atlas
          mkdir -p site/local-ai
          mkdir -p site/hollow-square
          cp -R atlas-source/dist/. site/atlas/
          cp -R local-ai-source/presentation/. site/local-ai/
          cp -R hollow-square-source/. site/hollow-square/
          cp -R index.html styles.css CNAME .nojekyll site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
